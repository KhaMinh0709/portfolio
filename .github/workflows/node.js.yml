name: Deploy to VPS

on:
  push:
    branches:
      - main   # Branch để deploy (thay đổi nếu cần)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: 22
          script: |
            echo "🚀 Bắt đầu deploy Astro project"
            cd ~/apps/astro-boilerplate || mkdir -p ~/apps/astro-boilerplate && cd ~/apps/astro-boilerplate
            
            # Pull code mới nhất từ GitHub
            git pull origin main || git clone git@github.com:YOUR_USERNAME/YOUR_REPO.git .

            # Build Docker image
            docker compose build --no-cache
            
            # Chạy container
            docker compose up -d

            echo "✅ Deploy hoàn tất"
